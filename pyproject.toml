[project]
name = "hf2mlx"
version = "0.1.0"
description = "Convert Hugging Face models to MLX for Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "HF2MLX" }]
keywords = ["mlx", "huggingface", "llm", "apple-silicon", "quantization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.26",
    "mlx-lm>=0.22",
    "rich>=13.9",
    "typer>=0.15",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/jeonjw85/hf2mlx"
Issues = "https://github.com/jeonjw85/hf2mlx/issues"

[project.scripts]
hf2mlx = "hf2mlx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hf2mlx"]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.basedpyright]
typeCheckingMode = "all"
failOnWarnings = false
pythonVersion = "3.10"
pythonPlatform = "All"
include = ["hf2mlx", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
reportMissingTypeStubs = "warning"
reportAny = "warning"
reportExplicitAny = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownParameterType = "warning"
reportUnreachable = "none"
reportUnnecessaryComparison = "warning"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnusedParameter = "none"
reportUnusedCallResult = "none"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["hf2mlx", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    "DOC",
    "TC",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"hf2mlx/cli.py" = ["PLR0913", "PLR0917"]
"tests/**/*.py" = [
    "S101",
    "ARG",
    "PLR2004",
    "SLF001",
    "INP001",
    "S108",
    "EM",
    "TRY",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]
